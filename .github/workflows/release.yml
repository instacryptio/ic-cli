name: Release

# Build the icc binary for all supported platforms and attach them to a
# published GitHub Release. Every target is a native (or VM-native) cgo build
# WITH hardware-key support: challenge-response over HID via go-hid (vendors the
# hidapi C source — needs only libudev on Linux, system frameworks on macOS,
# nothing at link time on Windows), FIDO2 via libfido2, and PC/SC (Nitrokey 3)
# via ebfe/scard. No target falls back to a feature-reduced pure-Go build.
#
# Trigger: publishing a Release via the GitHub web UI. workflow_dispatch is also
# offered so a build can be re-run against an existing tag/release for testing
# (create a pre-release first — "published" fires for pre-releases too).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag/release to build and attach binaries to
        required: true

# The publish job needs to upload assets onto the release.
permissions:
  contents: write

# The release tag drives both the ldflags version stamp and the upload target.
# Resolves from the release event, or the manual-dispatch input.
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # --- Native POSIX runners: Linux + macOS, both arches ---------------------
  build-unix:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: icc-linux-amd64, runner: ubuntu-latest,    os: linux }
          - { asset: icc-linux-arm64, runner: ubuntu-24.04-arm, os: linux }
          - { asset: icc-macos-amd64, runner: macos-15-intel, os: macos }
          - { asset: icc-macos-arm64, runner: macos-latest,   os: macos }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # go-hid's Linux hidraw backend links libudev (libudev-dev); fido2 needs
      # libfido2-dev; the pcsc backend (ebfe/scard) needs libpcsclite-dev. ykpers
      # is gone (chalresp is go-hid now).
      - name: Install native deps (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libfido2-dev libpcsclite-dev

      # macOS ships `icc` as a bare binary, so it must be self-contained: we build
      # libfido2 + its deps (openssl, libcbor) as STATIC libs from source into a
      # private prefix and link those, leaving only the always-present macOS system
      # frameworks dynamic. go-hid (chalresp) and scard (pcsc) use system frameworks
      # (IOKit/CoreFoundation, PCSC) — nothing to build. Here we just need the build
      # tools; the heavy lifting is the cached dep build below. (untap aws/tap to keep
      # a security product's build logs free of the runner's "untrusted tap" warning.)
      - name: Install build tools (macOS)
        if: matrix.os == 'macos'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install pkg-config cmake autoconf automake libtool

      # Cache the built static-dep prefix, keyed on the build script (bumping a
      # pinned version in it changes the hash → clean rebuild). Cold build is a few
      # minutes (openssl dominates); warm cache is instant via the script's marker.
      - name: Cache static deps (macOS)
        if: matrix.os == 'macos'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/deps
          key: macos-static-deps-${{ matrix.asset }}-${{ hashFiles('scripts/build-macos-static-deps.sh') }}

      - name: Build static deps (macOS)
        if: matrix.os == 'macos'
        run: PREFIX="${{ runner.temp }}/deps" bash scripts/build-macos-static-deps.sh

      # Linux stays a dynamic build (distro libs). Fallback drops to `nohw` (not
      # empty tags): post-migration, empty TAGS still compiles the C-linked HW
      # backends, so only `nohw` yields a pure-Go build if a C dep is missing.
      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: |
          make build TAGS="fido2 pcsc" BUILD_BIN=${{ matrix.asset }} VERSION=${TAG} \
          || make build TAGS=nohw BUILD_BIN=${{ matrix.asset }} VERSION=${TAG}

      # macOS static build: point cgo's pkg-config at the static-only prefix so the
      # forked go-hid's `#cgo darwin pkg-config: libusb-1.0` and go-libfido2's
      # `#cgo darwin pkg-config: libfido2` resolve to the .a archives there. go-hid uses
      # the LIBUSB backend on macOS (our fork — USB control transfers, no IOHIDManager,
      # so no Input Monitoring/TCC gate). Append libfido2's provider chain (cbor/crypto/z)
      # + the system frameworks the static libfido2 AND libusb darwin backends need
      # (IOKit/CoreFoundation), Security, and PCSC (scard). No `-static` (fails on macOS):
      # the .a-only prefix already forces static third-party libs. No `|| TAGS=` fallback —
      # a reduced fallback would still be dynamic and still not run on a Homebrew-free Mac.
      # (If the static libusb link reports missing ObjC symbols, add -lobjc below.)
      - name: Build (macOS, static third-party libs)
        if: matrix.os == 'macos'
        env:
          PREFIX: ${{ runner.temp }}/deps
        run: |
          set -eo pipefail
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CGO_CFLAGS="-I$PREFIX/include"
          export CGO_LDFLAGS="-L$PREFIX/lib -lcbor -lcrypto -lz \
            -framework CoreFoundation -framework IOKit -framework Security -framework PCSC"
          make build TAGS="fido2 pcsc" BUILD_BIN=${{ matrix.asset }} VERSION=${TAG}

      # Assert self-containment: every dylib dep must be a macOS system library
      # (/usr/lib/* or a /System/Library framework). A /opt/homebrew, /usr/local,
      # or private-prefix path means a third-party dylib leaked in.
      - name: Verify no non-system dylib deps (macOS)
        if: matrix.os == 'macos'
        run: |
          set -eo pipefail
          otool -L ${{ matrix.asset }} | tee otool.txt
          bad="$(otool -L ${{ matrix.asset }} | tail -n +2 | awk '{print $1}' \
                 | grep -vE '^/usr/lib/|^/System/Library/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::icc has non-system dynamic library dependencies:"; echo "$bad"
            exit 1
          fi
          echo "OK: only macOS system libraries/frameworks referenced."

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # --- Windows via MSYS2: amd64 (MINGW64), fully static ----------------------
  # The shipped binary is a bare .exe with no installer, so it must be
  # self-contained: we STATICALLY link libfido2/openssl/cbor AND the mingw runtime
  # (libgcc/libwinpthread) so a stock Windows box needs no DLLs. chalresp (go-hid)
  # and pcsc (scard) bind hid.dll/cfgmgr32.dll/winscard.dll at RUNTIME — system
  # DLLs, nothing to link. MSYS2 ships a static .a for every dep except libcbor,
  # which we build from source (matching MSYS2's exact version to stay ABI-compatible
  # with the installed libfido2.a). windows-arm64 is dropped: Windows-on-ARM runs the
  # amd64 binary under emulation, and clangarm64 static libs are unverified.
  build-windows:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: icc-windows-amd64
            runner: windows-latest
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            cc: gcc
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5

      # MSYS2's own Go + toolchain so cgo links against the mingw libs. We need
      # libfido2 + its static dep closure (openssl, cbor's deps, zlib), cmake/ninja
      # to build static libcbor, and ntldd to verify no non-system DLL deps. go-hid
      # links nothing at build time (runtime LoadLibrary of hid.dll/cfgmgr32.dll) and
      # scard is pure-Go (winscard.dll via LazyDLL) — so ykpers/yubico-c/libusb/json-c
      # are gone.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-go
            ${{ matrix.prefix }}-${{ matrix.cc }}
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-libfido2
            ${{ matrix.prefix }}-openssl
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-ntldd-git
            make git

      # MSYS2 ships libcbor as an import lib only (no static .a). Build it from
      # source at the SAME version MSYS2 installed (libfido2.a was compiled
      # against those headers) and install the static .a into /mingw64 alongside
      # the rest; -static then prefers the .a over the .dll.a.
      - name: Build static libcbor
        run: |
          set -eo pipefail
          CBOR_VER="$(pacman -Q ${{ matrix.prefix }}-libcbor | awk '{print $2}' | cut -d- -f1)"
          echo "Building static libcbor v${CBOR_VER} to match MSYS2's libfido2.a"
          git clone --depth 1 --branch "v${CBOR_VER}" https://github.com/PJK/libcbor
          # Build OUT of source (cbor-build, not libcbor/build): recent libcbor
          # ships a Bazel `BUILD` file that case-collides with `build` on Windows'
          # case-insensitive NTFS. CMAKE_POLICY_VERSION_MINIMUM=3.5: MSYS2's CMake
          # 4.x rejects libcbor's old cmake_minimum_required(<3.5); this floor lets
          # it configure.
          cmake -S libcbor -B cbor-build -G Ninja \
            -DBUILD_SHARED_LIBS=OFF -DWITH_EXAMPLES=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_BUILD_TYPE=Release
          # Build THEN install as two steps: `ninja install` does not build the
          # project first, so a combined --target install installs headers but
          # never compiles libcbor.a.
          cmake --build cbor-build
          cmake --install cbor-build
          test -f /mingw64/lib/libcbor.a

      # MSYS2's prebuilt libfido2.a was compiled against libcbor-as-a-DLL, so its
      # objects reference dllimport stubs (__imp_cbor_*) that can't resolve against
      # a static libcbor.a. Rebuild libfido2 from source (same version) with
      # -DCBOR_STATIC_DEFINE so it emits plain cbor_* symbols, and install the
      # static .a over MSYS2's. (openssl/zlib link fine from MSYS2's .a; only the
      # cbor export macro is the problem.)
      - name: Build static libfido2
        run: |
          set -eo pipefail
          FIDO_VER="$(pacman -Q ${{ matrix.prefix }}-libfido2 | awk '{print $2}' | cut -d- -f1)"
          echo "Building static libfido2 v${FIDO_VER} against static libcbor"
          git clone --depth 1 --branch "${FIDO_VER}" https://github.com/Yubico/libfido2
          cmake -S libfido2 -B fido-build -G Ninja \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_MANPAGES=OFF \
            -DBUILD_TOOLS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_FLAGS="-DCBOR_STATIC_DEFINE" \
            -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_BUILD_TYPE=Release
          cmake --build fido-build
          cmake --install fido-build
          test -f /mingw64/lib/libfido2.a

      # Fully static build. pkg-config supplies the -lfido2 consumer; CGO_LDFLAGS
      # appends -static plus libfido2's provider chain (cbor/ssl/crypto/z) and the
      # Windows system libs the .pc files under-declare. setupapi/hid/cfgmgr32 serve
      # go-libfido2 (-lhid -lsetupapi) and go-hid's runtime LoadLibrary targets;
      # winscard (scard/pcsc) is pure-Go, resolved at runtime — nothing to link.
      # No `|| TAGS=` fallback: the HW backends must build on Windows.
      - name: Build (static)
        run: |
          set -eo pipefail
          export CGO_LDFLAGS="-static -L/mingw64/lib \
            -lfido2 -lcbor -lssl -lcrypto -lz \
            -lsetupapi -lhid -lcfgmgr32 -lole32 -lbcrypt -lcrypt32 -lws2_32 -ladvapi32"
          make build STATIC=1 TAGS="fido2 pcsc" BUILD_BIN=${{ matrix.asset }} VERSION=${TAG}

      # Assert self-containment: ntldd must resolve ONLY Windows system DLLs.
      # Any mingw/msys runtime or third-party DLL means a dep leaked in.
      - name: Verify no non-system DLL deps
        run: |
          set -eo pipefail
          ntldd -R ${{ matrix.asset }} | tee ntldd.txt
          if grep -iE 'mingw|msys|clang|libgcc|libwinpthread|libfido2|libcbor|libcrypto|libssl|zlib1|libstdc' ntldd.txt; then
            echo "::error::icc.exe has non-system DLL dependencies — not self-contained"
            exit 1
          fi
          echo "OK: only Windows system DLLs referenced."

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # --- FreeBSD via QEMU VM: amd64 (on metal) + arm64 (emulated, slow) --------
  build-freebsd:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: icc-freebsd-amd64, arch: x86_64 }
          - { asset: icc-freebsd-arm64, arch: aarch64 }
    steps:
      - uses: actions/checkout@v5

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          # Pin to FreeBSD 14.x (the action's default is 15.x — DEFAULT_RELEASE
          # 15.1). A 15-built binary will NOT run on FreeBSD 14 (major-version ABI
          # bump, no forward shim), and lots of production hosts are still on 14. A
          # 14-built binary runs on BOTH 14 and 15 (COMPAT_FREEBSD14 + libc symbol
          # versioning), so 14 is the right single target. 14.3 is the newest 14.x
          # image vmactions publishes (no 14.4 image exists) and has both x86_64 and
          # aarch64 — and it still covers 14.4 hosts (same-major ABI; pkg's ABI tag
          # is per-major FreeBSD:14, so it installs current 14-branch packages).
          release: "14.3"
          arch: ${{ matrix.arch }}
          usesh: true
          # Forward the release tag into the guest (host env isn't inherited).
          envs: 'TAG'
          # BSD make can't parse the GNU-make Makefile — use gmake.
          #
          # IGNORE_OSVERSION: the FreeBSD:14 pkg repo is per-major and built on the
          # newest 14.x (14.4, OSVERSION 1404000), but this VM runs 14.3 (1403000),
          # so pkg's OSVERSION guard refuses the repo (and the [y/N] prompt defaults
          # to N non-interactively → hard fail). The packages are ABI-compatible
          # within the 14 major, and our binary is still built against the 14.3
          # userland (stays compatible with all 14.x + forward to 15), so proceed.
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            # libusb + iconv for go-hid's freebsd libusb backend are in the FreeBSD
            # base system (-lusb = base libusb-1.0 API, libiconv in base), so no pkg
            # needed for them. pcsc-lite provides libpcsclite for the scard backend.
            pkg install -y go gmake pkgconf git libfido2 pcsc-lite
          run: |
            # Resolve a usable pkg-config (OpenBSD ships its own; pkgconf provides
            # it on FreeBSD) and point it at the BSD .pc dirs (lib + libdata). The
            # Makefile + cgo both honor this PKG_CONFIG.
            export PKG_CONFIG="$(command -v pkg-config || command -v pkgconf || echo pkg-config)"
            PCP="/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig:/usr/local/share/pkgconfig"
            # Self-heal: prepend the actual dir of each .pc wherever the port put it.
            for pc in libfido2 libpcsclite libusb-1.0; do
              d="$(find /usr/local /usr/pkg -name "$pc.pc" 2>/dev/null | head -1)"
              [ -n "$d" ] && PCP="$(dirname "$d"):$PCP"
            done
            export PKG_CONFIG_PATH="$PCP"
            echo "--- build env ---"; uname -a; go version; grep icfx go.mod; echo "PKG_CONFIG=$PKG_CONFIG"
            echo "installed HW pkgs:"; (pkg_info 2>/dev/null || pkg info 2>/dev/null) | grep -iE 'fido|pcsc|ccid|usb' || echo "  (none matched!)"
            "$PKG_CONFIG" --cflags --libs libfido2 || echo "libfido2 NOT FOUND"
            "$PKG_CONFIG" --cflags --libs libpcsclite || echo "libpcsclite NOT FOUND"
            # Trust the rsync'd workspace so git doesn't exit 128 (dubious ownership)
            # — also lets the Makefile stamp a real commit; skip Go's own VCS stamp
            # regardless (we stamp via ldflags); and let Go fetch the go.mod toolchain
            # when the packaged one is older (OpenBSD ports: 1.26.2 vs required 1.26.6).
            git config --global --add safe.directory '*' 2>/dev/null || true
            export GOFLAGS=-buildvcs=false
            export GOTOOLCHAIN=auto
            # go-libfido2 ships NO freebsd/openbsd cgo directive, so -lfido2 is never
            # linked on BSD — inject it (via pkg-config, hardcoded fallback) alongside
            # the base /usr/local include+lib the compiler doesn't search by default.
            # Also inject libusb-1.0's cflags: on OpenBSD the go-hid fork's libusb
            # backend includes <libusb.h>, which the libusb1 package installs under
            # /usr/local/include/libusb-1.0 (pkg-config adds that -I). No-op on FreeBSD
            # (base libusb header is already on the default search path).
            export CGO_CFLAGS="-I/usr/local/include $("$PKG_CONFIG" --cflags libfido2 2>/dev/null) $("$PKG_CONFIG" --cflags libusb-1.0 2>/dev/null)"
            export CGO_LDFLAGS="-L/usr/local/lib $("$PKG_CONFIG" --libs libfido2 2>/dev/null || echo -lfido2) $("$PKG_CONFIG" --libs libusb-1.0 2>/dev/null)"
            gmake build TAGS="fido2 pcsc" BUILD_BIN=${{ matrix.asset }} VERSION=${TAG} \
            || { echo "--- HW build failed; retrying pure-Go (nohw) ---"; gmake build TAGS=nohw BUILD_BIN=${{ matrix.asset }} VERSION=${TAG}; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # --- OpenBSD via QEMU VM: amd64 (on metal) + arm64 (emulated, slow) --------
  # Built PER RELEASE: OpenBSD gives no cross-release binary compatibility (CGO links
  # versioned shared libs; libc syscall pinning), so one binary per supported release
  # × arch. We ship the latest two releases (OpenBSD's own support window); install.sh
  # picks the match via `uname -r`. Bump `release:` here + OBSD_SUPPORTED in install.sh
  # together each ~6-month cycle (once vmactions publishes the new image).
  build-openbsd:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: icc-openbsd-7.9-amd64, arch: x86_64,  release: "7.9" }
          - { asset: icc-openbsd-7.9-arm64, arch: aarch64, release: "7.9" }
          - { asset: icc-openbsd-7.8-amd64, arch: x86_64,  release: "7.8" }
          - { asset: icc-openbsd-7.8-arm64, arch: aarch64, release: "7.8" }
    steps:
      - uses: actions/checkout@v5

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          # Forward the release tag into the guest (host env isn't inherited).
          envs: 'TAG'
          prepare: |
            # go-hid's openbsd libusb backend (fork) needs libusb-1.0 → `libusb1`
            # (header under /usr/local/include/libusb-1.0) AND iconv → `libiconv`
            # (OpenBSD has no iconv in base, unlike FreeBSD; matches the comms/libhidapi
            # port's LIB_DEPENDS). pcsc-lite provides libpcsclite for the scard backend.
            # ykpers is gone (chalresp is go-hid).
            #
            # NB (runtime, not build): hidapi's libusb backend can only reach a device
            # if uhid(4)/uhidev(4) are disabled in the kernel (config(8)) — same caveat
            # as the comms/libhidapi port. The binary still BUILDS + ships regardless;
            # HW challenge-response on a stock OpenBSD kernel is therefore best-effort.
            pkg_add -I go gmake pkgconf git libfido2 libusb1 libiconv pcsc-lite
          run: |
            # Resolve a usable pkg-config (OpenBSD ships its own; pkgconf provides
            # it on FreeBSD) and point it at the BSD .pc dirs (lib + libdata). The
            # Makefile + cgo both honor this PKG_CONFIG.
            export PKG_CONFIG="$(command -v pkg-config || command -v pkgconf || echo pkg-config)"
            PCP="/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig:/usr/local/share/pkgconfig"
            # Self-heal: prepend the actual dir of each .pc wherever the port put it.
            for pc in libfido2 libpcsclite libusb-1.0; do
              d="$(find /usr/local /usr/pkg -name "$pc.pc" 2>/dev/null | head -1)"
              [ -n "$d" ] && PCP="$(dirname "$d"):$PCP"
            done
            export PKG_CONFIG_PATH="$PCP"
            echo "--- build env ---"; uname -a; go version; grep icfx go.mod; echo "PKG_CONFIG=$PKG_CONFIG"
            echo "installed HW pkgs:"; (pkg_info 2>/dev/null || pkg info 2>/dev/null) | grep -iE 'fido|pcsc|ccid|usb' || echo "  (none matched!)"
            "$PKG_CONFIG" --cflags --libs libfido2 || echo "libfido2 NOT FOUND"
            "$PKG_CONFIG" --cflags --libs libpcsclite || echo "libpcsclite NOT FOUND"
            # Trust the rsync'd workspace so git doesn't exit 128 (dubious ownership)
            # — also lets the Makefile stamp a real commit; skip Go's own VCS stamp
            # regardless (we stamp via ldflags); and let Go fetch the go.mod toolchain
            # when the packaged one is older (OpenBSD ports: 1.26.2 vs required 1.26.6).
            git config --global --add safe.directory '*' 2>/dev/null || true
            export GOFLAGS=-buildvcs=false
            export GOTOOLCHAIN=auto
            # go-libfido2 ships NO freebsd/openbsd cgo directive, so -lfido2 is never
            # linked on BSD — inject it (via pkg-config, hardcoded fallback) alongside
            # the base /usr/local include+lib the compiler doesn't search by default.
            # Also inject libusb-1.0's cflags: on OpenBSD the go-hid fork's libusb
            # backend includes <libusb.h>, which the libusb1 package installs under
            # /usr/local/include/libusb-1.0 (pkg-config adds that -I). No-op on FreeBSD
            # (base libusb header is already on the default search path).
            export CGO_CFLAGS="-I/usr/local/include $("$PKG_CONFIG" --cflags libfido2 2>/dev/null) $("$PKG_CONFIG" --cflags libusb-1.0 2>/dev/null)"
            export CGO_LDFLAGS="-L/usr/local/lib $("$PKG_CONFIG" --libs libfido2 2>/dev/null || echo -lfido2) $("$PKG_CONFIG" --libs libusb-1.0 2>/dev/null)"
            gmake build TAGS="fido2 pcsc" BUILD_BIN=${{ matrix.asset }} VERSION=${TAG} \
            || { echo "--- HW build failed; retrying pure-Go (nohw) ---"; gmake build TAGS=nohw BUILD_BIN=${{ matrix.asset }} VERSION=${TAG}; }

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # --- Collect every built binary, checksum them, attach to the release ------
  # All-or-nothing: this job has no `if:`, so it runs ONLY when every needed
  # build job succeeds. Because the matrices are fail-fast: false, each matrix
  # job reports success only if all its entries pass — so a single failed target
  # (any OS/arch) skips publish and leaves the release without partial assets.
  publish:
    name: Upload assets + checksums
    needs: [build-unix, build-windows, build-freebsd, build-openbsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum icc-* > checksums.txt
          echo "Built assets:"
          cat checksums.txt

      - name: Upload to release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" icc-* checksums.txt \
            --repo "${{ github.repository }}" --clobber
